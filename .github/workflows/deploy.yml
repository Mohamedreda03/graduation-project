name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            echo "========================================="
            echo "🚀 Starting Deployment..."
            echo "========================================="

            # --------- Install Docker ---------
            if ! command -v docker &> /dev/null; then
              echo "📦 Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ${{ secrets.SERVER_USER }}
            fi

            # --------- Install Docker Compose ---------
            if ! command -v docker-compose &> /dev/null; then
              echo "📦 Installing Docker Compose..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            # --------- Install Nginx ---------
            if ! command -v nginx &> /dev/null; then
              echo "📦 Installing Nginx..."
              sudo apt-get update
              sudo apt-get install -y nginx
              sudo systemctl start nginx
              sudo systemctl enable nginx
            fi

            # --------- Setup Swap (if not already) ---------
            if [ ! -f /swapfile ]; then
              echo "💾 Creating 2GB swap..."
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            # --------- Clone or Pull Project ---------
            PROJECT_PATH="/home/${{ secrets.SERVER_USER }}/graduation-project"

            if [ ! -d "$PROJECT_PATH" ]; then
              echo "📥 Cloning project..."
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "$PROJECT_PATH"
              cd "$PROJECT_PATH"
            else
              cd "$PROJECT_PATH"
              echo "📥 Pulling latest changes..."
              git fetch --all
              git reset --hard origin/main
            fi

            # --------- Setup .env ---------
            echo "⚙️ Setting up environment..."
            echo "${{ secrets.BACKEND_ENV }}" > "$PROJECT_PATH/backend/.env"

            # --------- Setup Nginx ---------
            echo "🔧 Configuring Nginx..."

            # Remove default nginx site to prevent conflicts
            sudo rm -f /etc/nginx/sites-enabled/default

            # Copy our config
            sudo cp "$PROJECT_PATH/server-nginx.conf" /etc/nginx/sites-available/attendance
            sudo ln -sf /etc/nginx/sites-available/attendance /etc/nginx/sites-enabled/attendance

            # Test and reload nginx
            if sudo nginx -t; then
              sudo systemctl reload nginx
              echo "✅ Nginx configured successfully"
            else
              echo "❌ Nginx config test failed!"
              exit 1
            fi

            # --------- Free Disk Space Before Build ---------
            echo "🧹 Cleaning up disk space before build..."
            echo "📊 Disk usage before cleanup:"
            df -h /

            # Remove stopped containers
            sudo docker container prune -f || true
            # Remove unused images (dangling + unreferenced)
            sudo docker image prune -a -f || true
            # Remove unused volumes
            sudo docker volume prune -f || true
            # Remove unused networks
            sudo docker network prune -f || true
            # Remove unused build cache
            sudo docker builder prune -a -f || true
            # Clean apt cache
            sudo apt-get clean || true
            sudo rm -rf /var/lib/apt/lists/* || true

            echo "📊 Disk usage after cleanup:"
            df -h /

            # --------- Build and Start Docker Containers ---------
            echo "🐳 Building and starting containers..."
            cd "$PROJECT_PATH"

            # Stop existing containers
            sudo docker-compose -f docker-compose.deploy.yml down

            # Build and start
            sudo docker-compose -f docker-compose.deploy.yml up -d --build

            # Wait for health check
            echo "⏳ Waiting for services to be healthy..."
            sleep 15

            # Check if containers are running
            echo "📊 Container status:"
            sudo docker-compose -f docker-compose.deploy.yml ps

            # Final cleanup of dangling images only
            sudo docker image prune -f || true

            echo "========================================="
            echo "✅ Deployment Complete!"
            echo "========================================="
            echo "🌐 API:    http://api.${{ secrets.SERVER_IP }}.nip.io"
            echo "💻 Admin:  http://att-admin.${{ secrets.SERVER_IP }}.nip.io"
            echo "👨‍🏫 Doctor: http://att-doctor.${{ secrets.SERVER_IP }}.nip.io"
            echo "========================================="

services:
  mongodb:
    image: mongo:7
    container_name: attendance-db
    restart: unless-stopped
    command: >
      mongod
      --wiredTigerCacheSizeGB 0.5
      --setParameter diagnosticDataCollectionEnabled=false
      --quiet
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: attendance_system
    volumes:
      - mongodb_data:/data/db
    mem_limit: 768m
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh -u admin -p admin123 --authenticationDatabase admin localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/attendance_system?authSource=admin
      - PORT=5000
      - NODE_ENV=production
    ports:
      - "5000:5000"
    mem_limit: 512m
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin-dashboard:
    build: ./admin-dashboard
    container_name: admin-dashboard
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "3001:80"
    networks:
      - app-network

  doctor-dashboard:
    build: ./doctor-dashboard
    container_name: doctor-dashboard
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "3002:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:

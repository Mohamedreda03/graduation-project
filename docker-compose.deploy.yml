services:
  mongodb:
    image: mongo:latest
    container_name: attendance-db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: attendance_system
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    container_name: backend
    restart: always
    environment:
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/attendance_system?authSource=admin
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy

  admin-dashboard:
    build: ./admin-dashboard
    container_name: admin-dashboard
    restart: always
    ports:
      - "3001:80"

  doctor-dashboard:
    build: ./doctor-dashboard
    container_name: doctor-dashboard
    restart: always
    ports:
      - "3002:80"

volumes:
  mongodb_data:

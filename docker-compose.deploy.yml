services:
  mongodb:
    image: mongo:latest
    container_name: attendance-db
    restart: unless-stopped
    command: >
      mongod
      --wiredTigerCacheSizeGB 0.25
      --setParameter diagnosticDataCollectionEnabled=false
      --quiet
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: attendance_system
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh -u admin -p admin123 --authenticationDatabase admin localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/attendance_system?authSource=admin
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin-dashboard:
    build: ./admin-dashboard
    container_name: admin-dashboard
    restart: unless-stopped
    ports:
      - "3001:80"

  doctor-dashboard:
    build: ./doctor-dashboard
    container_name: doctor-dashboard
    restart: unless-stopped
    ports:
      - "3002:80"

volumes:
  mongodb_data:
